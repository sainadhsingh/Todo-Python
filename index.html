<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A sleek, modern web-based To-Do List Application with real-time tracking, local storage persistence, and task filtering.">
    <title>TaskMaster - Elegant To-Do List</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div>
                    <h1>Todo-Python Web</h1>
                    <p class="subtitle">Organize your daily tasks efficiently</p>
                </div>
            </div>
        </header>

        <!-- Metrics Dashboard -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
                <div class="stat-icon icon-total">📊</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="pending-count">0</span>
                </div>
                <div class="stat-icon icon-pending">⏳</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completed-count">0</span>
                </div>
                <div class="stat-icon icon-completed">✅</div>
            </div>
        </section>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <span class="progress-text" id="progress-text">0% Done</span>
        </div>

        <!-- Add Task Input Card -->
        <section class="card input-card">
            <form id="add-task-form">
                <div class="input-group">
                    <input type="text" id="task-title" placeholder="What needs to be done?" autocomplete="off" required>
                    <select id="task-priority" aria-label="Task Priority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button type="submit" id="add-btn" class="btn primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Controls (Filters + Search) -->
        <section class="controls-bar">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all" id="filter-all">All</button>
                <button class="tab-btn" data-filter="pending" id="filter-pending">Pending</button>
                <button class="tab-btn" data-filter="completed" id="filter-completed">Completed</button>
            </div>
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
            </div>
        </section>

        <!-- Task List Area -->
        <section class="card task-list-card">
            <ul id="task-list" class="task-list">
                <!-- Dynamically Populated -->
            </ul>
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">📝</div>
                <h3>No tasks found</h3>
                <p id="empty-msg">You have no tasks matching this filter. Add one above!</p>
            </div>
        </section>

        <!-- Footer / Data Tools -->
        <footer class="app-footer">
            <button id="clear-completed-btn" class="btn secondary-btn">Clear Completed</button>
            <button id="export-json-btn" class="btn secondary-btn">Export tasks.json</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
